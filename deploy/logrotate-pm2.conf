# PM2 日志轮转(安装为 /etc/logrotate.d/pm2-onstarvoice,root:root 644)。
# 走系统 logrotate(Ubuntu 的 logrotate.timer 每天跑一次),不装 pm2-logrotate 模块,
# 省掉一个常驻进程的内存;copytruncate 让 pm2 打开的文件句柄继续有效。
# 2026-10-09 前旧单进程日志曾攒到 760 MB,从未轮转。
/root/.pm2/logs/*.log {
    daily
    maxsize 50M
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
