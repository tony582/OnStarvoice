# Include inside the voice.minilife.online HTTPS server, before other regex locations.
# Release controllers, source archives, manifests and backups belong outside this tree.
location ~ "^/downloads/(StarVoice-extension-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}\.zip)$" {
    alias /opt/onstarvoice/public-downloads/$1;
    disable_symlinks on;
    default_type application/zip;
    add_header X-Content-Type-Options nosniff always;
    expires 1h;
}

location ~* "^/downloads(?:/|$)" {
    add_header Cache-Control "no-store" always;
    return 404;
}
